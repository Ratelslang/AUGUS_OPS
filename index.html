// --- Attachments (IndexedDB blobs + metadata) ---
let IDB=null;function idbOpen(){return new Promise((res,rej)=>{if(IDB)return res(IDB);let r=indexedDB.open('aegis_files_db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>{IDB=r.result;res(IDB)};r.onerror=()=>rej(r.error)});}
async function idbPut(rec){let db=await idbOpen();return new Promise((res,rej)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});}
async function idbGet(id){let db=await idbOpen();return new Promise((res,rej)=>{let q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});}
async function idbDel(id){let db=await idbOpen();return new Promise(res=>{let t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>res();});}
function fileCount(id){return DB.attachments.filter(a=>a.recordId===id).length}function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
async function compressImage(f){if(!f.type.startsWith('image/'))return f;try{let b=await createImageBitmap(f);let sc=Math.min(1,1400/Math.max(b.width,b.height));let c=document.createElement('canvas');c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext('2d').drawImage(b,0,0,c.width,c.height);let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));return new File([blob],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});}catch(e){return f;}}
async function handleFiles(e){let files=[...e.target.files];for(let f of files){if(f.size>15*1024*1024){toast('Skipped '+f.name+': over 15 MB');continue;}let p=await compressImage(f);pendingFiles.push({name:p.name,type:p.type||'application/octet-stream',size:p.size,blob:p});}e.target.value='';renderPending();}
function renderPending(){let el=document.getElementById('pendingList');if(el)el.innerHTML=pendingFiles.length?pendingFiles.map((f,i)=>`<span class="filechip">${f.type.startsWith('image/')?'🖼':'📄'} ${esc(f.name)} (${fmtSize(f.size)}) <button type="button" onclick="pendingFiles.splice(${i},1);renderPending()">✕</button></span>`).join(''):'<span class="muted">No files selected yet.</span>';}
async function savePendingFiles(rid,mod){for(let f of pendingFiles){let meta={id:uid(),recordId:rid,module:mod,name:f.name,type:f.type,size:f.size,created:new Date().toISOString()};DB.attachments.push(meta);try{await idbPut({id:meta.id,blob:f.blob});}catch(e){toast('Could not store '+f.name);} }pendingFiles=[];}
async function viewFiles(rid,mod,title){let list=DB.attachments.filter(a=>a.recordId===rid);$('#fileModalTitle').textContent='📎 Attachments — '+title;let body=$('#fileModalBody');body.innerHTML=list.length?'<p class="muted">'+list.length+' file(s).</p>'+list.map(a=>`<div class="glass card"><b>${esc(a.name)}</b><div class="muted">${esc(a.type)} • ${fmtSize(a.size)} • ${esc(a.created.slice(0,10))}</div><div id="prev-${a.id}" class="muted" style="margin:8px 0">Loading…</div><div class="row"><button class="btn2" onclick="downloadFile('${a.id}')">⬇ Download</button><button class="danger" onclick="deleteFile('${a.id}','${rid}','${mod}','${esc(title).replace(/'/g,'')}')">Delete</button></div></div>`).join(''):'<p class="muted">No attachments yet. Edit this record and add photos / documents.</p>';$('#fileModal').classList.add('open');for(let a of list){try{let rec=await idbGet(a.id);let el=document.getElementById('prev-'+a.id);if(!el)continue;if(!rec){el.textContent='File blob not found in this browser.';continue;}let url=URL.createObjectURL(rec.blob);if(a.type.startsWith('image/'))el.innerHTML=`<img src="${url}" style="max-width:100%;border-radius:12px">`;else if(a.type==='application/pdf')el.innerHTML=`<a href="${url}" target="_blank">Open PDF →</a>`;else el.innerHTML=`<a href="${url}" download="${esc(a.name)}">Open / download →</a>`;}catch(e){}}}
function closeFileModal(){$('#fileModal').classList.remove('open');}
async function downloadFile(id){let meta=DB.attachments.find(a=>a.id===id);let rec=await idbGet(id);if(!rec){toast('File not found in this browser');return;}let url=URL.createObjectURL(rec.blob);let a=document.createElement('a');a.href=url;a.download=meta?meta.name:'file';a.click();}
async function deleteFile(id,rid,mod,title){if(!confirm('Delete this attachment?'))return;DB.attachments=DB.attachments.filter(a=>a.id!==id);await idbDel(id);save();if(rid&&rid!=='library')viewFiles(rid,mod,title);else render();}
async function uploadToLibrary(e){let files=[...e.target.files];for(let f of files){if(f.size>15*1024*1024)continue;let p=await compressImage(f);let meta={id:uid(),recordId:'library',module:'files',name:p.name,type:p.type,size:p.size,created:new Date().toISOString()};DB.attachments.push(meta);await idbPut({id:meta.id,blob:p});}save();render();toast('Uploaded ✓');}

function eodText(){let d=$('#eodDate')?.value||today(),t=$('#eodTime')?.value||'12:00',prem=$('#eodPremises')?.value||DB.settings.premises,gates=$('#eodGates')?.value||'All secure',alarm=$('#eodAlarm')?.value||'Yes',cctv=$('#eodCCTV')?.value||'Yes',inc=$('#eodIncidents')?.value||'None',notes=($('#eodNotes')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);
let lines=[];lines.push('END OF DAY SECURITY REPORT*');lines.push('━━━━━━━━━━━━━━━━━━━━');lines.push('📅 *Date:* '+fmtDate(d));lines.push('🕐 *Time Secured:* '+t);lines.push('━━━━━━━━━━━━━━━━━━━━');lines.push('🏭 *Premises Status*');lines.push('• Gates & Doors: '+gates+' ✓');lines.push('• Alarm: '+(alarm==='Yes'?'Yes — Alarm Armed ✓':alarm==='No'?'No — Alarm Not Armed':'Alarm: '+alarm));lines.push('• CCTV: '+(cctv==='Yes'?'Yes — CCTV Active ✓':cctv==='No'?'No — CCTV Inactive':'CCTV: '+cctv));lines.push('• Incidents: '+inc+' ✓');lines.push('━━━━━━━━━━━━━━━━━━━━');lines.push('📝 *Notes:*');lines.push('');if(notes.length)notes.forEach(n=>lines.push('- *'+n+'*'));else lines.push('- *No additional notes.*');lines.push('');lines.push('━━━━━━━━━━━━━━━━━━━━');lines.push('✓ *'+prem+' '+DB.settings.eodFooter.replace(prem,'').trim()+'*');lines.push('');lines.push('---------------------------');return lines.join('\n');}
function copyEOD(){let txt=eodText();navigator.clipboard?.writeText(txt).then(()=>toast('EOD copied — paste into WhatsApp ✓')).catch(()=>{let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('EOD copied ✓');});}

function sodText(){
let d=document.getElementById('sodDate')?.value||today(),t=document.getElementById('sodTime')?.value||'06:00';
let prem=document.getElementById('sodPremises')?.value||DB.settings.premises;
let officer=document.getElementById('sodOfficer')?.value||DB.settings.officer;
let shift=document.getElementById('sodShift')?.value||'Day Shift';
let team=document.getElementById('sodTeam')?.value||'';
let veh=document.getElementById('sodVehicle')?.value||'';
let brief=(document.getElementById('sodBrief')?.value||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);
let gates=document.getElementById('sodGates')?.value||'All secure';
let alarm=document.getElementById('sodAlarm')?.value||'Yes';
let cctv=document.getElementById('sodCCTV')?.value||'Yes';
let lines=[];
lines.push('START OF DAY SECURITY REPORT*');
lines.push('━━━━━━━━━━━━━━━━━━━━');
lines.push('📅 *Date:* '+fmtDate(d));
lines.push('🕐 *Time Started:* '+t);
lines.push('👮 *Officer on Duty:* '+officer);
lines.push('🕐 *Shift:* '+shift);
if(team)lines.push('👥 *Team:* '+team);
if(veh)lines.push('🚙 *Vehicle:* '+veh);
lines.push('━━━━━━━━━━━━━━━━━━━━');
lines.push('🏭 *Premises Status*');
lines.push('• Gates & Doors: '+gates+' ✓');
lines.push('• Alarm: '+(alarm==='Yes'?'Yes — Alarm Armed ✓':'No — Alarm Not Armed'));
lines.push('• CCTV: '+(cctv==='Yes'?'Yes — CCTV Active ✓':'No — CCTV Inactive'));
lines.push('━━━━━━━━━━━━━━━━━━━━');
lines.push('📝 *Briefing / Plan for Today:*');lines.push('');
if(brief.length)brief.forEach(n=>lines.push('- *'+n+'*'));else lines.push('- *No additional briefing.*');
lines.push('');lines.push('━━━━━━━━━━━━━━━━━━━━');
lines.push('✓ *'+prem+' — shift started, premises checked and secure.*');
lines.push('');lines.push('---------------------------');
return lines.join(String.fromCharCode(10));}
function copySOD(){let txt=sodText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('SOD copied — paste into WhatsApp ✓')).catch(()=>fallbackCopy(txt));}else fallbackCopy(txt);}
function fallbackCopy(txt){let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied ✓');}
function printSOD(){let w=window.open('','_blank');w.document.write('<html><head><title>Start of Day</title><style>body{font-family:monospace;padding:30px;white-space:pre-wrap;line-height:1.7}</style></head><body><h2>START OF DAY SECURITY REPORT</h2><pre>'+esc(sodText())+'</pre><script>window.print()</'+'script></body></html>');w.document.close();}

function formHTML(mod,rec={}){return F[mod].map(([k,label,type])=>{let v=rec[k]??(k==='date'?today():'');if(type==='textarea')return `<label>${label}</label><textarea name="${k}" rows="3">${esc(v)}</textarea>`;if(type?.startsWith('select:')){let o=type.slice(7).split('|');if(v&&!o.includes(v))o=[v,...o];let ph=v?'':`<option value="" selected disabled>— Select ${label} —</option>`;return `<label>${label}</label><select name="${k}" required>${ph}${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}return `<label>${label}</label><input name="${k}" type="${type}" value="${esc(v)}">`}).join('');}
function tagFor(v){if(['Open','Urgent','Critical','High','Missed','Escalated'].includes(v))return 'tag red';if(['Done','Completed','Closed','Acknowledged','Active','In Service'].includes(v))return 'tag green';if(['Medium','In Progress','Scheduled'].includes(v))return 'tag amber';return 'tag';}
function listHTML(mod){let rows=[...(DB[mod]||[])];if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));if(gq)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(gq.toLowerCase()));if(filter)rows=rows.filter(r=>Object.values(r).includes(filter));if(!rows.length)return '<p class="muted">No records match.</p>';let keys=F[mod].map(f=>f[0]).slice(0,5);return `<div style="overflow:auto"><table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}<th class="noprint">📎 Files</th><th class="noprint">Actions</th></tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${['status','severity','priority','risk'].includes(k)?`<span class="${tagFor(r[k])}">${esc(r[k])}</span>`:esc(r[k])}</td>`).join('')}<td class="noprint"><button class="btn2" onclick="viewFiles('${r.id}','${mod}','${esc((r.name||r.title||r.item||r.make||'Record')).replace(/'/g,'')}')">📎 ${fileCount(r.id)}</button></td><td class="noprint" style="white-space:nowrap"><button class="btn2" onclick="editRec('${mod}','${r.id}')">Edit</button> <button class="btn2" onclick="dupRec('${mod}','${r.id}')">Copy</button> <button class="danger" onclick="delRec('${mod}','${r.id}')">Delete</button></td></tr>`).join('')}</table></div>`;}
function crudHTML(mod,title,extra=''){let filters=[...new Set((DB[mod]||[]).flatMap(r=>[r.status,r.priority,r.severity].filter(Boolean)))];return `<h2>${title}</h2><p class="muted">${(DB[mod]||[]).length} records • Filter, search, export, print.</p><div class="row noprint"><input placeholder="Search this module…" value="${esc(q)}" oninput="q=this.value;render()" style="max-width:260px"><div class="row">${filters.map(f=>`<button class="btn2" style="${filter===f?'background:#20242a;color:#fff':''}" onclick="filter='${esc(f)}';render()">${f}</button>`).join('')}${filter?`<button class="btn2" onclick="filter='';render()">✕ Clear</button>`:''}</div><button class="btn2" onclick="exportCSV('${mod}')">⬇ CSV</button><label class="btn2" style="cursor:pointer">⬆ Import CSV<input type="file" accept=".csv" hidden onchange="importCSV(event,'${mod}')"></label><button class="btn2" onclick="window.print()">🖨 Print / PDF</button></div>${extra}<div class="glass card"><h3 id="formTitle">＋ Add New</h3><form id="f" onsubmit="saveRec(event,'${mod}')">${formHTML(mod)}<label>📎 Photo / Document Attachments (auto-compressed, max 15 MB)</label><input type="file" multiple onchange="handleFiles(event)"><div id="pendingList" style="margin-top:8px"><span class="muted">No files selected.</span></div><label>📷 Take a photo now</label><input type="file" accept="image/*" capture="environment" onchange="handleFiles(event)"><div class="row" style="margin-top:12px"><button class="btn" type="submit">Save Record + Attachments</button><button class="btn2" type="button" onclick="resetForm('${mod}')">Clear</button></div></form></div><div class="glass card">${listHTML(mod)}</div>`;}
function resetForm(mod){editId=null;pendingFiles=[];let f=$('#f');if(f)f.reset();let t=$('#formTitle');if(t)t.textContent='＋ Add New';}
function editRec(mod,id){pendingFiles=[];let r=DB[mod].find(x=>x.id===id);editId=id;$('#formTitle').textContent='✎ Editing Record';F[mod].forEach(([k])=>{let el=document.querySelector(`[name="${k}"]`);if(el)el.value=r[k]??''});window.scrollTo({top:0,behavior:'smooth'});}
function dupRec(mod,id){let r={...DB[mod].find(x=>x.id===id),id:uid()};DB[mod].unshift(r);save();render();toast('Duplicated ✓');}
function delRec(mod,id){if(confirm('Delete this record?')){DB[mod]=DB[mod].filter(x=>x.id!==id);save();render();toast('Deleted');}}
async function saveRec(e,mod){e.preventDefault();let fd=new FormData(e.target);let missing=F[mod].filter(([k,label])=>label.includes('*')&&!(fd.get(k)||'').trim());if(missing.length){toast('Please fill in: '+missing.map(m=>m[1].replace(' *','')).join(', '));let el=document.querySelector(`[name="${missing[0][0]}"]`);if(el)el.focus();return;}let o={id:editId||uid()};F[mod].forEach(([k])=>o[k]=fd.get(k)||'');if(editId){DB[mod]=DB[mod].map(x=>x.id===editId?o:x)}else DB[mod].unshift(o);editId=null;save();await savePendingFiles(o.id,mod);save();render();toast('Saved ✓ — attachments saved');}
function exportCSV(mod){let rows=DB[mod]||[];if(!rows.length)return toast('Nothing to export');let keys=Object.keys(rows[0]);let csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=mod+'.csv';a.click();}
function parseCSVLine(line){let out=[],cur='',inq=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(inq&&line[i+1]==='"'){cur+='"';i++;}else inq=!inq;}else if(c===','&&!inq){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out;}
function importCSV(e,mod){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let lines=r.result.split(/\r?\n/).filter(x=>x.trim());let headers=parseCSVLine(lines[0]).map(h=>h.trim());let added=0;for(let line of lines.slice(1)){let vals=parseCSVLine(line);let o={id:uid()};F[mod].forEach(([k])=>{let i=headers.findIndex(h=>h.toLowerCase()===k.toLowerCase());if(i>=0)o[k]=vals[i]||'';});DB[mod].unshift(o);added++;}save();render();toast('Imported '+added+' rows ✓');}catch(err){toast('Could not parse CSV')}};r.readAsText(f);e.target.value='';}
function toggleCheck(id){let c=DB.checklist.find(x=>x.id===id);c.done=!c.done;save();render();}
function addCheck(){let v=prompt('New checklist item:');if(v){DB.checklist.push({id:uid(),date:today(),item:v,done:false});save();render();}}
function readiness(){let t=DB.checklist.filter(c=>c.date===today());return t.length?Math.round(100*t.filter(c=>c.done).length/t.length):0;}
function expiryAlerts(){let out=[];let lim=new Date();lim.setDate(lim.getDate()+30);[...DB.personal,...DB.vault].forEach(d=>{if(d.expiry&&new Date(d.expiry)<=lim)out.push(`${d.title} — ${d.expiry}`)});DB.vehicles.forEach(v=>{if(v.serviceDue&&new Date(v.serviceDue)<=lim)out.push(`${v.make} service — ${v.serviceDue}`)});return out;}

function drawChart(){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d');let data=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10);data.push({d:ds.slice(5),mv:DB.movement.filter(x=>x.date===ds).length,inc:DB.incidents.filter(x=>x.date===ds).length,hrs:DB.timesheet.filter(x=>x.date===ds).reduce((s,r)=>s+(+r.hours||0),0)});}let max=Math.max(5,...data.map(x=>Math.max(x.mv,x.inc,x.hrs)));let W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(0,0,0,.12)';for(let y=0;y<=4;y++){let yy=10+y*(H-30)/4;ctx.beginPath();ctx.moveTo(30,yy);ctx.lineTo(W-10,yy);ctx.stroke();}data.forEach((x,i)=>{let px=40+i*(W-60)/6;let bar=(v,col,off)=>{let hh=(v/max)*(H-40);ctx.fillStyle=col;ctx.fillRect(px+off,H-20-hh,12,hh);};bar(x.hrs,'#20242a',-16);bar(x.mv,'#9ca3af',0);bar(x.inc,'#ef4444',16);ctx.fillStyle='#5b6470';ctx.font='11px Inter';ctx.fillText(x.d,px-12,H-4);});}

h=`<h2>📎 Attachments / Files Library</h2><p class="muted">Every photo + document attached to any record, in one place. Photos auto-compressed. Max 15 MB per file.</p><div class="glass card" style="text-align:center"><b>⬆ Upload photos / documents</b><p class="muted">PDF, Word, Excel, images, scans, licences, contracts — anything.</p><input type="file" multiple onchange="uploadToLibrary(event)"><div class="row" style="justify-content:center;margin-top:10px"><label class="btn">📷 Take Photo<input type="file" accept="image/*" capture="environment" hidden onchange="uploadToLibrary(event)"></label></div></div><div class="row" style="margin:12px 0"><input placeholder="Search files…" value="${esc(q)}" oninput="q=this.value;render()" style="max-width:300px"><span class="muted">Total: ${list.length} files • ${((DB.attachments||[]).reduce((s,a)=>s+a.size,0)/1048576).toFixed(1)} MB</span></div>${list.length?list.map(a=>`<div class="glass card"><b>${esc(a.name)}</b><div class="muted">${esc(a.module)} • ${esc(a.type)} • ${fmtSize(a.size)} • ${esc(a.created.slice(0,10))}</div><div class="row" style="margin-top:8px"><button class="btn2" onclick="viewFiles('${a.recordId}','${a.module}','${esc(a.name).replace(/'/g,'')}')">👁 View</button><button class="btn2" onclick="downloadFile('${a.id}')">⬇ Download</button><button class="danger" onclick="deleteFile('${a.id}','library','files','Library')">Delete</button></div></div>`).join(''):'<p class="muted">No attachments yet.</p>'}`;
}else{const titles={clients:'Client Profiles',vehicles:'Client Vehicles',calendar:'Calendar / Itinerary',notes:'Notes',timesheet:'Timesheet',fuel:'Fuel Log',comms:'Comms Log',requests:'Request Log',incidents:'Incident Log',personal:'Personal Documents',vault:'Vault — Confidential Documents',movement:'Movement Log'};let extra='';if(cur==='vehicles')extra=`<div class="glass card" style="border-color:#fde68a"><b>🔧 Service due soon:</b> ${DB.vehicles.filter(v=>v.serviceDue&&new Date(v.serviceDue)<=new Date(Date.now()+30*864e5)).map(v=>esc(v.make)+' ('+esc(v.plate)+') — '+esc(v.serviceDue)).join(' • ')||'None in next 30 days.'}</div>`;if(cur==='personal'||cur==='vault')extra=`<div class="glass card"><b>⏰ Expiring in 30 days:</b> ${expiryAlerts().join(' • ')||'None.'}</div>`;h=crudHTML(cur,titles[cur]||cur,extra);}
$('#app').innerHTML=h;drawChart();}
function renderEODPreview(){let el=$('#eodPreview');if(el)el.textContent=eodText();}
function runSelfTest(){let res=[];let imgs=[...document.querySelectorAll('img')];res.push('Images on screen: '+imgs.length+' — '+(imgs.every(i=>i.complete&&i.naturalWidth>0)?'✅ all loaded':'⚠ some not loaded yet / check logo fallback'));res.push('Logo file: '+(document.querySelector('header img')?'✅ header logo present':'❌ header logo missing'));let mods=MODULES.map(m=>m.id).join(', ');res.push('Modules: '+MODULES.length+' — '+mods);let dd=0;for(let m in F){dd+=F[m].filter(f=>String(f[2]).startsWith('select:')).length;}res.push('Dropdowns defined: '+dd+' across '+Object.keys(F).length+' forms');let tot=Object.keys(DB).filter(k=>Array.isArray(DB[k])).reduce((a,k)=>a+DB[k].length,0);res.push('Records in storage: '+tot+' across modules');try{localStorage.setItem('aegis_test','1');localStorage.removeItem('aegis_test');res.push('localStorage: ✅ working');}catch(e){res.push('localStorage: ❌ blocked');}res.push('PIN: '+(DB.settings.pin?'✅ set':'❌ not set'));res.push('Attachments: '+(DB.attachments?DB.attachments.length+' files':'0'));document.getElementById('selfTest').innerHTML=res.map(r=>'<div>• '+r+'</div>').join('');toast('Self-test done ✓');}
function saveSettings(){DB.settings.company=$('#co').value;DB.settings.officer=$('#off').value;DB.settings.premises=$('#prem').value;DB.settings.pin=$('#newpin').value||'1234';save();toast('Settings saved ✓');render();}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='aegis-ops-backup.json';a.click();}
function importAll(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();render();toast('Backup restored ✓');}catch{toast('Invalid file')}};r.readAsText(f);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
drawPin();document.addEventListener('change',function(e){let f=e.target.closest('form');if(!f)return;let st=f.querySelector('[name="start"]'),en=f.querySelector('[name="end"]'),hr=f.querySelector('[name="hours"]');if(st&&en&&hr&&st.value&&en.value){let a=st.value.split(':').map(Number),b=en.value.split(':').map(Number);let h=(b[0]*60+b[1]-a[0]*60-a[1])/60;if(h<0)h+=24;hr.value=Math.round(h*100)/100;}});
document.addEventListener('error',function(e){let t=e.target;if(t&&t.tagName==='IMG'&&t.src.indexOf('logo.webp')>-1){t.onerror=null;t.src='icons/icon-192.png';}},true);let _tx=0;document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-_tx;let lockEl=document.getElementById('lock');if(Math.abs(dx)>90&&lockEl.style.display==='none'){let idx=MODULES.findIndex(m=>m.id===cur);if(dx<-90&&idx<MODULES.length-1)go(MODULES[idx+1].id);if(dx>90&&idx>0)go(MODULES[idx-1].id);}});
</script></body></html>
