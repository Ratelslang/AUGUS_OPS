<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AEGIS — Executive Protection Ops</title><meta name="theme-color" content="#4a4a4a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AEGIS Ops"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f2f2f2;color:#222}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#4a4a4a;color:#fff;display:flex;gap:12px;align-items:center;padding:10px 14px}header img{width:42px;height:42px;border-radius:10px;background:#fff;object-fit:cover}header h1{font-size:17px;margin:0}header p{margin:0;font-size:11px;color:#ddd}.pill{margin-left:auto;background:#fff;color:#333;border:0;border-radius:999px;padding:7px 12px;font-weight:700}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:62px;z-index:19}nav button{white-space:nowrap;border:1px solid #ddd;background:#f7f7f7;border-radius:999px;padding:8px 13px}nav button.on{background:#4a4a4a;color:#fff;border-color:#4a4a4a}
main{max-width:1100px;margin:0 auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e2e2;border-radius:14px;padding:14px}.card b{font-size:26px}.muted{color:#777;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:#4a4a4a;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.btn2{background:#fff;border:1px solid #bbb;border-radius:9px;padding:9px 12px}.danger{background:#fff;border:1px solid #c00;color:#c00;border-radius:9px;padding:8px 10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}label{font-size:12px;font-weight:700;color:#555;display:block;margin:10px 0 4px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}th{background:#eee}.tag{display:inline-block;background:#eee;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}
#lock{position:fixed;inset:0;background:#e8e8e8;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}.lockbox{background:#fff;padding:24px;border-radius:16px;width:320px;text-align:center;box-shadow:0 10px 40px #0002}.lockbox img{width:84px;height:84px;border-radius:18px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.keys button{padding:13px;border-radius:10px;border:1px solid #ddd;background:#f7f7f7;font-weight:800}
@media(max-width:640px){table{font-size:12px}header h1{font-size:15px}}
@media print{header,nav,.noprint{display:none!important}main{max-width:none}body{background:#fff}}</style></head>
<body>
<div id="lock"><div class="lockbox"><img src="logo.webp" alt="AEGIS logo"><h2 style="margin:10px 0 2px">AEGIS OPS</h2><p class="muted">Executive Protection • PIN 1234 to start</p><div id="dots" style="letter-spacing:8px;font-size:22px;min-height:28px"></div><div class="keys" id="keys"></div><button class="btn2" onclick="unlockDemo()">Use demo PIN</button><p class="muted">Change PIN in Settings after login.</p></div></div>
<header><img src="logo.webp" alt="logo"><div><h1>AEGIS — Executive Protection Ops</h1><p id="todayLine">Daily Operations • Gray / White</p></div><button class="pill noprint" onclick="installApp()">⬇ Install App</button><button class="pill noprint" onclick="lock()">🔒 Lock</button></header>
<nav id="nav" class="noprint"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB=JSON.parse(localStorage.getItem('aegis_ops_v1')||'null');
if(!DB){DB={clients:[{id:uid(),name:'Client — Demo Principal',type:'Principal',phone:'+27 82 000 0000',email:'principal@example.com',address:'Sandton, Johannesburg',risk:'Medium',notes:'Prefers early departures. No unscheduled stops.',status:'Active'}],vehicles:[{id:uid(),client:'Client — Demo Principal',make:'Toyota Land Cruiser',plate:'ABC 123 GP',colour:'Grey',fuelType:'Diesel',odometer:'48200',serviceDue:'2026-12-01',status:'In Service',notes:'Full tank check every morning'}],calendar:[{id:uid(),date:today(),time:'07:00',title:'Morning briefing + vehicle check',client:'Client — Demo Principal',location:'Base',status:'Scheduled'}],notes:[{id:uid(),date:today(),title:'Route note',body:'Check roadworks on main route before 07:30 departure.',tag:'Route'}],timesheet:[{id:uid(),date:today(),officer:'Duty Officer',start:'06:00',end:'18:00',hours:12,client:'Client — Demo Principal',notes:'Close protection detail'}],fuel:[{id:uid(),date:today(),vehicle:'Toyota Land Cruiser (ABC 123 GP)',litres:42,amount:1050,odometer:'48350',station:'Sandton',receipt:'Yes'}],comms:[{id:uid(),date:today(),time:'07:05',from:'Control',to:'Detail 1',channel:'Radio Ch 1',message:'All call signs check in.',status:'Sent'}],requests:[{id:uid(),date:today(),client:'Client — Demo Principal',item:'Additional driver for evening move',priority:'High',status:'Open',notes:''}],incidents:[{id:uid(),date:today(),time:'09:10',client:'Client — Demo Principal',type:'Suspicious vehicle',severity:'Low',location:'Office park entrance',description:'Vehicle lingered 5 min, then left. Plate noted.',action:'Logged, area checked',status:'Closed'}],eod:[],personal:[{id:uid(),title:'PSIRA Certificate',category:'Licence',expiry:'2027-03-01',ref:'PSIRA-0001',notes:'Keep copy in vehicle'}],vault:[{id:uid(),title:'Client NDA',category:'Contract',owner:'Client — Demo Principal',expiry:'2027-01-01',notes:'Confidential — do not share'}],movement:[{id:uid(),date:today(),time:'07:30',client:'Client — Demo Principal',from:'Home — Sandton',to:'Office — Sandton',vehicle:'Toyota Land Cruiser (ABC 123 GP)',odometerStart:'48350',odometerEnd:'48372',status:'Completed'}],settings:{pin:'1234',company:'AEGIS',officer:'Duty Officer'}};save();}
function save(){localStorage.setItem('aegis_ops_v1',JSON.stringify(DB));}
const MODULES=[
{id:'overview',label:'🏠 Overview'},{id:'clients',label:'👤 Client Profiles'},{id:'vehicles',label:'🚙 Client Vehicles'},{id:'monthly',label:'📊 Monthly Report'},{id:'calendar',label:'📅 Calendar / Itinerary'},{id:'notes',label:'📝 Notes'},{id:'timesheet',label:'⏱ Timesheet'},{id:'fuel',label:'⛽ Fuel'},{id:'comms',label:'📡 Comms'},{id:'requests',label:'📥 Request Log'},{id:'incidents',label:'⚠ Incident Log'},{id:'eod',label:'🌙 End of Day Report'},{id:'personal',label:'🪪 Personal'},{id:'vault',label:'🔐 Vault'},{id:'movement',label:'🛣 Movement'},{id:'settings',label:'⚙ Settings'}];
let cur='overview',q='',deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
function installApp(){if(deferred){deferred.prompt()}else alert('Install: Chrome/Edge menu → Install app. iPhone Safari → Share → Add to Home Screen. Must be on HTTPS (GitHub Pages works).');}
function lock(){document.getElementById('lock').style.display='flex';pin='';drawPin();}
let pin='';
function drawPin(){$('#dots').textContent='●'.repeat(pin.length)+'○'.repeat(4-pin.length)}
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('');
function pinKey(k){if(k==='C')pin='';else if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;drawPin();if(pin.length===4){if(pin===DB.settings.pin){document.getElementById('lock').style.display='none';render();}else{alert('Wrong PIN');pin='';drawPin();}}}
function unlockDemo(){pin=DB.settings.pin;drawPin();pinKey('');}
const F={
clients:[['name','Name *','text'],['type','Type','select:Principal|Family Member|Corporate|VIP|Other'],['phone','Phone','tel'],['email','Email','email'],['address','Address','text'],['risk','Risk Level','select:Low|Medium|High|Critical'],['status','Status','select:Active|Inactive|On Leave'],['notes','Notes / Preferences','textarea']],
vehicles:[['client','Client','text'],['make','Vehicle Make / Model *','text'],['plate','Registration Plate *','text'],['colour','Colour','text'],['fuelType','Fuel Type','select:Petrol|Diesel|Hybrid|Electric'],['odometer','Odometer (km)','number'],['serviceDue','Service Due','date'],['status','Status','select:In Service|In Workshop|Off Duty'],['notes','Notes','textarea']],
calendar:[['date','Date','date'],['time','Time','time'],['title','Title *','text'],['client','Client','text'],['location','Location','text'],['status','Status','select:Scheduled|In Progress|Done|Cancelled']],
notes:[['date','Date','date'],['title','Title *','text'],['tag','Tag','select:General|Route|Client|Vehicle|Briefing|Other'],['body','Note','textarea']],
timesheet:[['date','Date','date'],['officer','Officer','text'],['start','Start','time'],['end','End','time'],['hours','Hours','number'],['client','Client','text'],['notes','Notes','textarea']],
fuel:[['date','Date','date'],['vehicle','Vehicle','text'],['litres','Litres','number'],['amount','Amount (R)','number'],['odometer','Odometer','number'],['station','Station','text'],['receipt','Receipt','select:Yes|No']],
comms:[['date','Date','date'],['time','Time','time'],['from','From','text'],['to','To','text'],['channel','Channel','select:Radio Ch 1|Radio Ch 2|Phone|WhatsApp|Email'],['message','Message','textarea'],['status','Status','select:Sent|Received|Acknowledged|Missed']],
requests:[['date','Date','date'],['client','Client','text'],['item','Request *','text'],['priority','Priority','select:Low|Medium|High|Urgent'],['status','Status','select:Open|In Progress|Done|Declined'],['notes','Notes','textarea']],
incidents:[['date','Date','date'],['time','Time','time'],['client','Client','text'],['type','Type','select:Suspicious vehicle|Suspicious person|Medical|Vehicle issue|Threat|Theft|Other'],['severity','Severity','select:Low|Medium|High|Critical'],['location','Location','text'],['description','What happened','textarea'],['action','Action taken','textarea'],['status','Status','select:Open|Closed|Escalated']],
personal:[['title','Document *','text'],['category','Category','select:Licence|ID|Certificate|Medical|Training|Insurance|Other'],['expiry','Expiry','date'],['ref','Reference No.','text'],['notes','Notes','textarea']],
vault:[['title','Document *','text'],['category','Category','select:Contract|NDA|Client File|Policy|SOP|Other'],['owner','Owner / Client','text'],['expiry','Expiry','date'],['notes','Notes (do not paste passwords)','textarea']],
movement:[['date','Date','date'],['time','Time','time'],['client','Client','text'],['from','From','text'],['to','To','text'],['vehicle','Vehicle','text'],['odometerStart','Odometer Start','number'],['odometerEnd','Odometer End','number'],['status','Status','select:Scheduled|In Progress|Completed|Cancelled']],
eod:[['date','Date','date'],['officer','Officer','text'],['summary','Day Summary','textarea'],['incidentsSummary','Incidents Summary','textarea'],['handover','Handover / Next Shift','textarea'],['status','Status','select:Draft|Submitted']],};
function nav(){ $('#nav').innerHTML=MODULES.map(m=>`<button class="${m.id===cur?'on':''}" onclick="go('${m.id}')">${m.label}</button>`).join('');}
function go(id){cur=id;render();}
function formHTML(mod,rec={}){return F[mod].map(([k,label,type])=>{let v=rec[k]??(k==='date'?today():'');if(type==='textarea')return `<label>${label}</label><textarea name="${k}" rows="3">${esc(v)}</textarea>`;if(type?.startsWith('select:')){let o=type.slice(7).split('|');return `<label>${label}</label><select name="${k}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}return `<label>${label}</label><input name="${k}" type="${type}" value="${esc(v)}">`}).join('');}
function listHTML(mod){
 let rows=DB[mod]||[]; if(q) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 if(!rows.length) return '<p class="muted">No records yet. Add one below.</p>';
 let keys=F[mod].map(f=>f[0]).slice(0,6);
 return `<div style="overflow:auto"><table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}<th class="noprint">Actions</th></tr>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}<td class="noprint"><button class="btn2" onclick="editRec('${mod}','${r.id}')">Edit</button> <button class="danger" onclick="delRec('${mod}','${r.id}')">Delete</button></td></tr>`).join('')}</table></div>`;
}
function crudHTML(mod,title){return `<h2>${title}</h2><div class="row noprint"><input id="search" placeholder="Search this module…" value="${esc(q)}" oninput="q=this.value;render()" style="max-width:320px"><button class="btn2" onclick="exportCSV('${mod}')">⬇ Export CSV</button><button class="btn2" onclick="window.print()">🖨 Print</button></div><div class="card" style="margin-top:12px"><h3 style="margin:0" id="formTitle">＋ Add New</h3><form id="f" onsubmit="saveRec(event,'${mod}')">${formHTML(mod)}<div class="row" style="margin-top:12px"><button class="btn" type="submit">Save Record</button><button class="btn2" type="button" onclick="resetForm('${mod}')">Clear</button></div></form></div><div style="margin-top:14px">${listHTML(mod)}</div>`;}
let editId=null;
function resetForm(mod){editId=null;$('#formTitle').textContent='＋ Add New';$('#f').reset();}
function editRec(mod,id){let r=DB[mod].find(x=>x.id===id);editId=id;$('#formTitle').textContent='✎ Editing Record';F[mod].forEach(([k])=>{let el=document.querySelector(`[name="${k}"]`);if(el)el.value=r[k]??''});window.scrollTo({top:0,behavior:'smooth'});}
function delRec(mod,id){if(confirm('Delete this record?')){DB[mod]=DB[mod].filter(x=>x.id!==id);save();render();}}
function saveRec(e,mod){e.preventDefault();let fd=new FormData(e.target),o={id:editId||uid()};F[mod].forEach(([k])=>o[k]=fd.get(k)||'');if(editId){DB[mod]=DB[mod].map(x=>x.id===editId?o:x)}else DB[mod].unshift(o);editId=null;save();render();alert('Saved ✓');}
function exportCSV(mod){let rows=DB[mod]||[];if(!rows.length)return alert('Nothing to export');let keys=Object.keys(rows[0]);let csv=[keys.join(',')].concat(rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=mod+'.csv';a.click();}
function render(){
 nav();$('#todayLine').textContent=new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' • '+DB.settings.company+' Ops';
 let h='';
 if(cur==='overview'){
  let t=DB.timesheet.reduce((s,r)=>s+(+r.hours||0),0), fu=DB.fuel.reduce((s,r)=>s+(+r.amount||0),0), km=DB.movement.reduce((s,r)=>s+((+r.odometerEnd||0)-(+r.odometerStart||0)),0);
  h=`<h2>Overview — Today & Totals</h2><div class="grid"><div class="card"><div class="muted">Active Clients</div><b>${DB.clients.filter(c=>c.status==='Active').length}</b></div><div class="card"><div class="muted">Vehicles In Service</div><b>${DB.vehicles.filter(v=>v.status==='In Service').length}</b></div><div class="card"><div class="muted">Today's Itinerary</div><b>${DB.calendar.filter(c=>c.date===today()).length}</b></div><div class="card"><div class="muted">Open Requests</div><b>${DB.requests.filter(r=>r.status==='Open').length}</b></div><div class="card"><div class="muted">Open Incidents</div><b>${DB.incidents.filter(r=>r.status==='Open').length}</b></div><div class="card"><div class="muted">Total Hours Logged</div><b>${t}</b></div><div class="card"><div class="muted">Total Fuel Spend (R)</div><b>${fu.toLocaleString()}</b></div><div class="card"><div class="muted">Movement Distance (km)</div><b>${km}</b></div></div>
  <h3>Today's Itinerary</h3>${DB.calendar.filter(c=>c.date===today()).map(c=>`<div class="card"><b>${esc(c.time)} — ${esc(c.title)}</b><div class="muted">${esc(c.client)} • ${esc(c.location)} • <span class="tag">${esc(c.status)}</span></div></div>`).join('')||'<p class="muted">Nothing scheduled today.</p>'}
  <h3>⚠ Open Incidents / Requests</h3>${[...DB.incidents.filter(i=>i.status==='Open'),...DB.requests.filter(r=>r.status==='Open')].map(x=>`<div class="card">${esc(x.type||x.item||'')} — ${esc(x.description||x.notes||'')} <span class="tag">${esc(x.status)}</span></div>`).join('')||'<p class="muted">All clear.</p>'}
  <div class="row noprint" style="margin-top:14px"><button class="btn" onclick="go('eod')">Write End of Day Report →</button><button class="btn2" onclick="go('movement')">Log Movement →</button><button class="btn2" onclick="go('incidents')">Log Incident →</button></div>`;
 } else if(cur==='monthly'){
  let m=prompt('Month (YYYY-MM):',today().slice(0,7)); if(!m)m=today().slice(0,7);
  let inM=r=>String(r.date||'').startsWith(m);
  let hrs=DB.timesheet.filter(inM).reduce((s,r)=>s+(+r.hours||0),0), fu=DB.fuel.filter(inM).reduce((s,r)=>s+(+r.amount||0),0), l=DB.fuel.filter(inM).reduce((s,r)=>s+(+r.litres||0),0);
  h=`<h2>Monthly Report — ${m}</h2><div class="grid"><div class="card"><div class="muted">Hours</div><b>${hrs}</b></div><div class="card"><div class="muted">Fuel Spend (R)</div><b>${fu.toLocaleString()}</b></div><div class="card"><div class="muted">Litres</div><b>${l}</b></div><div class="card"><div class="muted">Movements</div><b>${DB.movement.filter(inM).length}</b></div><div class="card"><div class="muted">Incidents</div><b>${DB.incidents.filter(inM).length}</b></div><div class="card"><div class="muted">Requests</div><b>${DB.requests.filter(inM).length}</b></div></div>
  <h3>Incidents this month</h3>${DB.incidents.filter(inM).map(i=>`<div class="card">${esc(i.date)} — ${esc(i.type)} (${esc(i.severity)}) — ${esc(i.description)}</div>`).join('')||'<p class="muted">None.</p>'}
  <h3>Movements this month</h3>${DB.movement.filter(inM).map(x=>`<div class="card">${esc(x.date)} ${esc(x.time)} — ${esc(x.from)} → ${esc(x.to)} (${esc(x.client)})</div>`).join('')||'<p class="muted">None.</p>'}
  <button class="btn noprint" onclick="window.print()">🖨 Print Monthly Report</button>`;
 } else if(cur==='settings'){
  h=`<h2>Settings & Backup</h2><div class="card"><label>Company Name</label><input id="co" value="${esc(DB.settings.company)}"><label>Default Officer</label><input id="off" value="${esc(DB.settings.officer)}"><label>Change PIN (4 digits)</label><input id="newpin" maxlength="4" inputmode="numeric" value="${esc(DB.settings.pin)}"><div class="row" style="margin-top:12px"><button class="btn" onclick="saveSettings()">Save Settings</button></div></div>
  <div class="card" style="margin-top:12px"><h3>Backup</h3><div class="row"><button class="btn2" onclick="exportAll()">⬇ Export Full Backup (JSON)</button><label class="btn2">⬆ Import Backup<input type="file" id="imp" accept=".json" hidden onchange="importAll(event)"></label><button class="danger" onclick="if(confirm('Delete ALL data?')){localStorage.removeItem('aegis_ops_v1');location.reload()}">Delete All Data</button></div><p class="muted">Install: Chrome/Edge menu → Install app. iPhone Safari → Share → Add to Home Screen. App works offline after first load.</p></div>`;
 } else if(cur==='eod'){
  h=`<h2>End of Day Report</h2><p class="muted">Auto-summary below pulls today's itinerary, movements, incidents, fuel and hours. Add your narrative, then Save.</p><div class="card"><b>Today auto-summary</b><p>Itinerary: ${DB.calendar.filter(c=>c.date===today()).length} items • Movements: ${DB.movement.filter(c=>c.date===today()).length} • Incidents: ${DB.incidents.filter(c=>c.date===today()).length} • Fuel: R${DB.fuel.filter(c=>c.date===today()).reduce((s,r)=>s+(+r.amount||0),0)} • Hours: ${DB.timesheet.filter(c=>c.date===today()).reduce((s,r)=>s+(+r.hours||0),0)}</p><p>${DB.incidents.filter(c=>c.date===today()).map(i=>esc(i.type)+': '+esc(i.description)).join('<br>')||'No incidents today.'}</p></div>`+crudHTML('eod','EOD Records');
 } else {
  const titles={clients:'Client Profiles',vehicles:'Client Vehicles',calendar:'Calendar / Itinerary',notes:'Notes',timesheet:'Timesheet',fuel:'Fuel Log',comms:'Comms Log',requests:'Request Log',incidents:'Incident Log',personal:'Personal Documents',vault:'Vault — Confidential Documents',movement:'Movement Log'};
  h=crudHTML(cur,titles[cur]||cur);
 }
 $('#app').innerHTML=h;
}
function saveSettings(){DB.settings.company=$('#co').value;DB.settings.officer=$('#off').value;DB.settings.pin=$('#newpin').value||'1234';save();alert('Settings saved');render();}
function exportAll(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='aegis-ops-backup.json';a.click();}
function importAll(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();render();alert('Backup restored');}catch{alert('Invalid file')}};r.readAsText(f);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
$('#todayLine').textContent=new Date().toLocaleDateString();
drawPin();
</script></body></html>
